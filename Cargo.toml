[package]
name = "torrent-lite"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.91"
description = "Offline foundations for a lightweight local-first BitTorrent client"
license = "Apache-2.0"
repository = "https://github.com/MiguelNevesCamargoJunior/torrent-lite"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
librqbit-core = "=9.0.1"
librqbit-bencode = "=9.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

