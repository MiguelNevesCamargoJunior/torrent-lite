[package]
name = "torrent-lite"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.91"
description = "Offline foundations for a lightweight local-first BitTorrent client"
license = "Apache-2.0"
repository = "https://github.com/MiguelNevesCamargoJunior/torrent-lite"
publish = false

[features]
engine-qualification = ["dep:anyhow", "dep:librqbit", "dep:tokio"]
state-store = ["dep:rusqlite", "dep:uuid"]
durable-engine = ["engine-qualification", "state-store"]
policy-proxy = ["dep:tokio", "dep:getrandom", "tokio/net", "tokio/io-util", "tokio/sync"]
secure-engine-qualification = ["durable-engine", "policy-proxy"]
service-core = ["secure-engine-qualification"]

[dependencies]
anyhow = { version = "1.0", optional = true }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
librqbit-bencode = "=9.0.1"
librqbit-core = "=9.0.1"
librqbit = { version = "=9.0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
unicode-normalization = "0.1"
url = "2.5"
rusqlite = { version = "=0.41.0", features = ["bundled"], optional = true }
uuid = { version = "=1.29.0", features = ["v4"], optional = true }
getrandom = { version = "=0.3.4", optional = true }

[[test]]
name = "state_store"
required-features = ["state-store"]

[target.'cfg(windows)'.dependencies]
winx = "=0.36.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "engine_local"
required-features = ["engine-qualification"]

[[test]]
name = "engine_persistent"
required-features = ["durable-engine"]

[[test]]
name = "policy_proxy"
required-features = ["policy-proxy"]

[[test]]
name = "engine_proxy"
required-features = ["secure-engine-qualification"]

[[test]]
name = "service_core"
required-features = ["service-core"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

