name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.91.1 fmt --all -- --check
      - name: Lints
        run: cargo +1.91.1 clippy --locked --all-targets -- -D warnings
      - name: State store lints
        run: cargo +1.91.1 clippy --locked --all-targets --features state-store -- -D warnings
      - name: Durable engine lints
        run: cargo +1.91.1 clippy --locked --all-targets --features durable-engine -- -D warnings
      - name: Policy proxy lints
        run: cargo +1.91.1 clippy --locked --all-targets --features policy-proxy -- -D warnings
      - name: Secure engine qualification lints
        run: cargo +1.91.1 clippy --locked --all-targets --features secure-engine-qualification -- -D warnings
      - name: Service core lints
        run: cargo +1.91.1 clippy --locked --all-targets --features service-core -- -D warnings
      - name: Local API lints
        run: cargo +1.91.1 clippy --locked --all-targets --features local-api -- -D warnings
      - name: Local client lints
        run: cargo +1.91.1 clippy --locked --all-targets --features api-client -- -D warnings
      - name: MCP lints
        run: cargo +1.91.1 clippy --locked --all-targets --features mcp -- -D warnings
      - name: Browser dashboard lints
        run: cargo +1.91.1 clippy --locked --all-targets --features browser-ui -- -D warnings
      - name: Tests
        run: cargo +1.91.1 test --locked
      - name: Durable state tests
        run: cargo +1.91.1 test --locked --features state-store --test state_store
      - name: Local peer engine qualification
        run: cargo +1.91.1 test --locked --features engine-qualification --test engine_local
      - name: Persistent engine storage qualification
        run: cargo +1.91.1 test --locked --features durable-engine --test engine_persistent
      - name: Local network policy proxy
        run: cargo +1.91.1 test --locked --features policy-proxy --test policy_proxy
      - name: Proxied persistent engine qualification
        run: cargo +1.91.1 test --locked --features secure-engine-qualification --test engine_proxy
      - name: Service core recovery
        run: cargo +1.91.1 test --locked --features service-core --test service_core
      - name: Local API authentication
        run: cargo +1.91.1 test --locked --features local-api --test local_api
      - name: Service discovery secret protection
        run: cargo +1.91.1 test --locked --features local-api --test service_discovery
      - name: Shared service client
        run: cargo +1.91.1 test --locked --features api-client --test api_client
      - name: MCP stdio protocol
        run: cargo +1.91.1 test --locked --features mcp --test mcp
      - name: Browser dashboard security
        run: cargo +1.91.1 test --locked --features browser-ui --test browser_ui

