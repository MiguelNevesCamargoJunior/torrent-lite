<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>torrent-lite</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:#eef5f1;background:#0b1312;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% -20%,#1c5246 0,transparent 45%),#0b1312}
main{max-width:960px;margin:auto;padding:clamp(24px,5vw,72px)}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:64px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.05em}.brand span{color:#67e6b1}.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a5c3b7;border:1px solid #34584e;border-radius:50px;padding:9px 14px}
h1{font-size:clamp(36px,6vw,62px);letter-spacing:-.065em;line-height:1.02;margin:0 0 16px}h1 em{font-style:normal;color:#67e6b1}p{color:#9eb2aa;line-height:1.6;margin:0}
.intro{margin-bottom:48px}.summary{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}.summary strong{font-size:26px}.summary small{color:#8da99e}
#status{font-size:13px;color:#8da99e;margin-top:10px}.online{color:#67e6b1!important}.error{color:#ff9d8e!important}
.list{display:grid;gap:12px}.card{border:1px solid #2b423a;background:#111e1a;border-radius:18px;padding:22px 24px;box-shadow:0 15px 40px #0002}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px}.identity{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d3e5dc}.state{font-size:12px;border-radius:40px;padding:6px 10px;background:#1f3f33;color:#8ceab8;text-transform:uppercase;letter-spacing:.08em}.state.paused{background:#3a3626;color:#e5c978}
.meta{display:flex;justify-content:space-between;color:#9eb2aa;font-size:13px;margin:20px 0 9px}.bar{height:7px;border-radius:20px;background:#293c34;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#42c992,#92f0ba);border-radius:20px;transition:width .3s}
.details{font-size:12px;color:#78968a;margin-top:12px}
.empty{border:1px dashed #34584e;border-radius:18px;padding:42px;text-align:center;color:#9eb2aa}footer{margin-top:48px;color:#6f8a7d;font-size:12px}
@media(max-width:600px){header{margin-bottom:50px}.row{align-items:flex-start}.identity{max-width:65vw}.card{padding:18px}}
</style>
</head>
<body><main>
<header><div class="brand">torrent<span>-lite</span></div><div class="tag">Local · sem anúncios</div></header>
<section class="intro"><h1>Seus downloads,<br><em>sem ruído.</em></h1><p>Acompanhe o progresso em tempo real. Tudo roda no seu computador.</p></section>
<section aria-label="Downloads"><div class="summary"><strong id="count">0 downloads</strong><small>atualização automática</small></div><div id="items" class="list"><div class="empty">Aguardando downloads…</div></div><p id="status" role="status">Conectando ao serviço…</p></section>
<footer>torrent-lite · interface local de leitura</footer>
</main><script>
const items=document.getElementById('items'),count=document.getElementById('count'),status=document.getElementById('status');
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function render(rows){items.replaceChildren();count.textContent=rows.length+' '+(rows.length===1?'download':'downloads');if(!rows.length){items.append(make('div','empty','Nenhum download nesta sessão.'));return}
for(const row of rows){const card=make('article','card'),head=make('div','row'),identity=make('div','identity',row.info_hash),label=row.desired==='paused'?'Pausado':row.finished?'Concluído':row.observed_state==='initializing'?'Verificando':row.observed_state?'Ativo':'Aguardando',state=make('span','state'+(row.desired==='paused'?' paused':''),label);head.append(identity,state);card.append(head);
const done=Number(row.progress_bytes||0),total=Number(row.total_bytes||0),pct=total>0?Math.min(100,Math.round(100*done/total)):0,meta=make('div','meta'),bar=make('div','bar'),fill=make('div','fill');
meta.append(make('span','',total>0?`${(done/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MiB`:'Aguardando metadados'),make('span','',total>0?pct+'%':'—'));fill.style.width=pct+'%';bar.append(fill);card.append(meta,bar);const speed=row.download_bytes_per_sec==null?'—':(row.download_bytes_per_sec/1048576).toFixed(2)+' MiB/s',peers=row.peers==null?'—':String(row.peers);card.append(make('div','details',`↓ ${speed} · ${peers} peers`));items.append(card)}}
async function refresh(){try{const res=await fetch('data',{cache:'no-store'});if(!res.ok)throw Error('offline');const rows=await res.json();render(rows);status.textContent='Serviço conectado · atualização a cada 2 segundos';status.className='online'}catch{status.textContent='Serviço indisponível. Tentando reconectar…';status.className='error'}finally{setTimeout(refresh,2000)}}refresh();
</script></body></html>
