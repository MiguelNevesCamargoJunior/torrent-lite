<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>torrent-lite</title>
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:#e5ecea;background:#121c21;font-synthesis:none;--line:#304147;--muted:#9db0b2;--signal:#6cc6d3;--amber:#deb172}
*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1120px;margin:auto;padding:0 clamp(22px,5vw,70px)}
.mast{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:20px;letter-spacing:-.045em}.mark{width:24px;height:24px;display:flex;align-items:center;gap:5px}.mark i{display:block;width:5px;height:16px;background:var(--signal)}.mark i:last-child{height:24px;background:#e5ecea}.context{font-size:13px;color:var(--muted)}
.heading{padding:52px 0 44px;display:flex;align-items:end;justify-content:space-between;gap:24px}.heading h1{font-size:clamp(30px,4vw,44px);font-weight:620;letter-spacing:-.055em;margin:0 0 8px}.heading p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}#status{font-size:13px;color:var(--muted);text-align:right;max-width:240px;line-height:1.5}.online{color:var(--signal)!important}.error{color:#eda395!important}
.summary{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:25px;font-size:13px;color:var(--muted)}.summary strong{color:#e5ecea;font-weight:600}.summary .live{color:var(--signal)}
.column-head,.transfer{display:grid;grid-template-columns:minmax(0,2fr) minmax(190px,1.2fr) 120px 100px;column-gap:24px;align-items:center}.column-head{padding:19px 0 10px;color:#839b9f;font-size:12px;border-bottom:1px solid var(--line)}.list{list-style:none;padding:0;margin:0}.transfer{padding:25px 0;border-bottom:1px solid var(--line);min-height:108px}.name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:isolate}.hash{display:block;font:12px Consolas,ui-monospace,monospace;color:#809a9e;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{font-size:12px;color:var(--signal);margin-top:8px}.state.paused{color:var(--amber)}.state.waiting{color:var(--muted)}
.metric{font-variant-numeric:tabular-nums}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-bottom:12px}.track{height:4px;background:#35474b}.fill{height:100%;background:var(--signal);transition:width .3s}.speed{color:#d5e2e1;font-size:14px}.peers{color:var(--muted);font-size:13px}.empty{padding:64px 0;border-bottom:1px solid var(--line)}.empty strong{font-size:18px;font-weight:600}.empty p{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 0}.empty code{font:13px Consolas,ui-monospace,monospace;color:var(--signal)}footer{padding:28px 0 42px;color:#789196;font-size:12px}
@media(max-width:760px){.mast{height:72px}.heading{padding:40px 0 30px;display:block}#status{text-align:left;margin-top:18px}.column-head{display:none}.transfer{grid-template-columns:minmax(0,1fr) 84px;gap:20px;padding:22px 0}.identity{grid-column:1/-1}.progress{grid-column:1/2}.speed{grid-column:2/3;grid-row:2;text-align:right}.peers{display:none}.hash{max-width:80vw}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body><div class="shell">
<header class="mast"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span>torrent-lite</div><div class="context">Painel local · somente leitura</div></header>
<main><div class="heading"><div><h1>Transferências</h1><p>Progresso verificado no seu computador. Atualização a cada 2 segundos.</p></div><div id="status" role="status">Conectando ao serviço…</div></div>
<section aria-label="Downloads"><div class="summary"><span><strong id="count">0</strong> downloads</span><span><strong id="active" class="live">0</strong> ativos</span></div><div class="column-head" aria-hidden="true"><span>Arquivo</span><span>Progresso</span><span>Velocidade</span><span>Peers</span></div><ul id="items" class="list"><li class="empty">Carregando…</li></ul></section></main>
<footer>Sem anúncios, telemetria ou recursos externos.</footer>
</div><script>
const items=document.getElementById('items'),count=document.getElementById('count'),active=document.getElementById('active'),status=document.getElementById('status');
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function stateOf(row){return String(row.observed_state||'').toLowerCase()}
function render(rows){items.replaceChildren();count.textContent=String(rows.length);active.textContent=String(rows.filter(row=>row.desired==='running'&&!row.finished&&stateOf(row)==='live').length);if(!rows.length){const empty=make('li','empty');empty.append(make('strong','', 'Nenhum download ainda.'),make('p','', 'Adicione um link magnético ou arquivo .torrent pelo terminal.'));items.append(empty);return}
for(const row of rows){const entry=make('li','transfer'),identity=make('div','identity'),name=make('div','name',row.name||'Torrent '+row.info_hash.slice(0,12)),hash=make('span','hash',row.info_hash);hash.title=row.info_hash;identity.append(name,hash);const label=row.finished?'Concluído':row.desired==='paused'?'Pausado':stateOf(row)==='initializing'?'Verificando':stateOf(row)==='live'?'Baixando':'Aguardando',state=make('div','state'+(label==='Pausado'?' paused':label==='Aguardando'?' waiting':''),label);identity.append(state);entry.append(identity);
const done=Number(row.progress_bytes||0),total=Number(row.total_bytes||0),progress=make('div','progress'),meta=make('div','progress-meta');if(total>0){const pct=Math.min(100,Math.round(100*done/total)),track=make('div','track'),fill=make('div','fill');meta.append(make('span','metric',`${(done/1048576).toFixed(1)} / ${(total/1048576).toFixed(1)} MiB`),make('span','metric',pct+'%'));fill.style.width=pct+'%';track.setAttribute('role','progressbar');track.setAttribute('aria-label','Progresso de '+(row.name||row.info_hash));track.setAttribute('aria-valuenow',String(pct));track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.append(fill);progress.append(meta,track)}else{progress.append(make('div','progress-meta','Aguardando metadados'))}entry.append(progress);
const speed=row.finished||row.download_bytes_per_sec==null?'—':(row.download_bytes_per_sec/1048576).toFixed(2)+' MiB/s',peers=row.peers==null?'—':String(row.peers);entry.append(make('div','speed metric',speed),make('div','peers metric',peers));items.append(entry)}}
async function refresh(){try{const res=await fetch('data',{cache:'no-store'});if(!res.ok)throw Error('offline');render(await res.json());status.textContent='Serviço conectado';status.className='online'}catch{status.textContent='Serviço indisponível. Tentando reconectar…';status.className='error'}finally{setTimeout(refresh,2000)}}refresh();
</script></body></html>
